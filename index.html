<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match & Master: The Periodic Challenge</title>
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Prevent all scrolling */
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Background fills entire viewport */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #4b0082 0%, #000000 100%);
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Fredoka', sans-serif;
            color: #fff;
            position: relative;
        }

        /* Subtle animated glow inside body */
        body::before,
        body::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 110%;
            height: 110%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), transparent 70%);
            animation: rotate 60s linear infinite;
            z-index: 0;
        }

        body::after {
            animation-duration: 90s;
            opacity: 0.6;
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Floating glowing atoms */
        .atoms::before,
        .atoms::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15), transparent 70%);
            animation: float 10s ease-in-out infinite alternate;
            z-index: 1;
        }

        .atoms::before {
            width: 200px;
            height: 200px;
            top: 20%;
            left: 20%;
        }

        .atoms::after {
            width: 180px;
            height: 180px;
            top: 65%;
            left: 70%;
            animation-duration: 14s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
            }

            100% {
                transform: translateY(-25px) translateX(15px);
            }
        }

        .portal-scale {
            width: 100%;
            max-width: 1100px;
            /* prevents stretching */
            margin: 0 auto;
            transform-origin: top center;
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 5;
            padding: 20px;
        }

        /* Game Title */
        .game-title {
            font-size: 3em;
            background: linear-gradient(to right, #ff6fd8, #69c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            margin-bottom: 60px;
            line-height: 1.3;
        }

        .game-title span {
            display: block;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            color: #ffeb3b;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        /* Button */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .main-btn {
            padding: 15px 50px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            background: linear-gradient(to right, #ff6fd8, #69c0ff);
            color: white;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s, background 0.3s;
        }

        .main-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(to right, #69c0ff, #ff6fd8);
        }

        /* Pulsing effect */
        .pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            }

            50% {
                box-shadow: 0 0 25px rgba(255, 255, 255, 1);
                transform: scale(1.05);
            }

            100% {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            }
        }

        /* ===================== RESPONSIVE DESIGN ===================== */

        /* Tablets */
        @media (max-width: 1024px) {
            .game-title {
                font-size: 2.3em;
                margin-bottom: 40px;
            }

            .game-title span {
                font-size: 0.6em;
            }

            .main-btn {
                padding: 12px 40px;
                font-size: 1em;
            }

            .atoms::before,
            .atoms::after {
                width: 140px;
                height: 140px;
                opacity: 0.12;
            }
        }

        /* Phones */
        @media (max-width: 600px) {
            .game-title {
                font-size: 1.7em;
                line-height: 1.2;
                margin-bottom: 30px;
            }

            .game-title span {
                font-size: 0.5em;
            }

            .main-btn {
                padding: 10px 28px;
                font-size: 0.85em;
                border-radius: 25px;
            }

            .atoms::before,
            .atoms::after {
                width: 100px;
                height: 100px;
                opacity: 0.1;
            }
        }
    </style>
</head>

<body>
    <div class="portal-scale">
        <!-- Floating particles (atoms) -->
        <div class="atoms"></div>

        <div class="container">
            <h1 class="game-title">
                Match & Master <br>
                <span>The Periodic Challenge</span>
            </h1>

            <div class="button-group">
                <button class="main-btn pulse" onclick="startGame()">▶ Play</button>
            </div>
        </div>
    </div>

    <script>
        function startGame() {
            window.location.href = "start.html"; // link to your main game page
        }
    </script>
</body>

</html>
